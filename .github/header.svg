<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">vite-plugin-static-magic-link</title>
  <desc id="d">With the link, the browser shows your site. Without it, there are only scrambled bytes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EE"/>
      <stop offset="1" stop-color="#FFE9DA"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .ink { fill: #2E2238; }
      .line { stroke: #2E2238; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
      .twinkle { animation: twinkle 2.6s ease-in-out infinite; }
      .d1 { animation-delay: .9s; }
      @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
      @media (prefers-reduced-motion: reduce) { .twinkle { animation: none; } }
    </style>
    <clipPath id="card"><rect width="1280" height="400" rx="28"/></clipPath>
    <path id="spark" d="M0 -12 C1.5 -3 3 -1.5 12 0 C3 1.5 1.5 3 0 12 C-1.5 3 -3 1.5 -12 0 C-3 -1.5 -1.5 -3 0 -12 Z"/>
  </defs>

  <!-- background -->
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <circle cx="1230" cy="380" r="120" fill="#FFD9C2" opacity=".55"/>
    <circle cx="40" cy="20" r="80" fill="#FFE7B8" opacity=".6"/>
  </g>

  <!-- title -->
  <text x="640" y="80" class="sans ink" font-size="46" font-weight="800" letter-spacing="-0.5" text-anchor="middle">vite-plugin-static-magic-link</text>
  <text x="640" y="118" class="sans" font-size="23" font-weight="500" fill="#6E5A6B" text-anchor="middle">A static site that only people with the link can open.</text>

  <!-- with the link: the site -->
  <g>
    <rect x="170" y="160" width="420" height="170" rx="18" fill="#FFFFFF"/>
    <path d="M188 161.5 H572 a16.5 16.5 0 0 1 16.5 16.5 V194 H171.5 V178 a16.5 16.5 0 0 1 16.5 -16.5 Z" fill="#FFE1D1"/>
    <line x1="171.5" y1="194" x2="588.5" y2="194" class="line"/>
    <rect x="170" y="160" width="420" height="170" rx="18" fill="none" class="line"/>
    <circle cx="194" cy="177" r="5.5" fill="#FF7A59"/>
    <circle cx="212" cy="177" r="5.5" fill="#FFC145"/>
    <circle cx="230" cy="177" r="5.5" fill="#2BB3A3"/>
    <rect x="250" y="167" width="250" height="20" rx="10" fill="#FFFFFF" stroke="#E6CDBF" stroke-width="1.5"/>
    <text x="264" y="182" class="mono" font-size="14" font-weight="600"><tspan class="ink">your.site/</tspan><tspan fill="#E8573A">#key=…</tspan></text>

    <!-- greeting card -->
    <g transform="translate(380 262) rotate(-4)">
      <rect x="-80" y="-48" width="160" height="96" rx="8" fill="#FFD6E2" stroke="#2E2238" stroke-width="2.5"/>
      <path d="M0 26 C-36 4 -24 -34 0 -17 C24 -34 36 4 0 26 Z" fill="#FF5A7A" stroke="#2E2238" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
    <use href="#spark" transform="translate(272 226) scale(.9)" fill="#FFC145" class="twinkle"/>
    <use href="#spark" transform="translate(492 300) scale(.75)" fill="#2BB3A3" class="twinkle d1"/>

    <!-- unlocked badge -->
    <g transform="translate(590 162)">
      <circle r="25" fill="#2BB3A3" stroke="#2E2238" stroke-width="3"/>
      <path d="M-7 -2 V-9 a7 7 0 0 1 13.5 -2.5" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <rect x="-11" y="-2" width="22" height="16" rx="3.5" fill="#FFFFFF"/>
      <circle cx="0" cy="5.5" r="2.6" fill="#2BB3A3"/>
    </g>
  </g>
  <text x="380" y="374" class="sans ink" font-size="24" font-weight="700" text-anchor="middle">With the link: your site</text>

  <!-- without the link: scrambled bytes -->
  <g>
    <rect x="690" y="160" width="420" height="170" rx="18" fill="#2E2238"/>
    <path d="M708 161.5 H1092 a16.5 16.5 0 0 1 16.5 16.5 V194 H691.5 V178 a16.5 16.5 0 0 1 16.5 -16.5 Z" fill="#EDE3DA"/>
    <line x1="691.5" y1="194" x2="1108.5" y2="194" class="line"/>
    <rect x="690" y="160" width="420" height="170" rx="18" fill="none" class="line"/>
    <circle cx="714" cy="177" r="5.5" fill="#C9BBB0"/>
    <circle cx="732" cy="177" r="5.5" fill="#C9BBB0"/>
    <circle cx="750" cy="177" r="5.5" fill="#C9BBB0"/>
    <rect x="770" y="167" width="250" height="20" rx="10" fill="#FFFFFF" stroke="#E6CDBF" stroke-width="1.5"/>
    <text x="784" y="182" class="mono" font-size="14" font-weight="600" fill="#8A7A86">your.site/</text>

    <text x="900" y="240" class="mono" font-size="20" font-weight="600" fill="#FFC145" text-anchor="middle">a7 f3 0c 9e 41 b2 7d e8 5c</text>
    <text x="900" y="270" class="mono" font-size="20" font-weight="600" fill="#FF9B85" text-anchor="middle">02 d9 6a 3f c1 88 0b 7e 13</text>
    <text x="900" y="300" class="mono" font-size="20" font-weight="600" fill="#C9B8F0" text-anchor="middle">e4 5a 90 2c f7 61 b8 04 dd</text>

    <!-- locked badge -->
    <g transform="translate(1110 162)">
      <circle r="25" fill="#FF7A59" stroke="#2E2238" stroke-width="3"/>
      <path d="M-7 -2 V-8 a7 7 0 0 1 14 0 V-2" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <rect x="-11" y="-2" width="22" height="16" rx="3.5" fill="#FFFFFF"/>
      <circle cx="0" cy="5.5" r="2.6" fill="#FF7A59"/>
    </g>
  </g>
  <text x="900" y="374" class="sans ink" font-size="24" font-weight="700" text-anchor="middle">Without it: scrambled bytes</text>
</svg>
